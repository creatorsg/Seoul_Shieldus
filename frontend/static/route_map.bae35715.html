    function pinIcon(color, size) {
        return {
            content: '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50% 50% 50% 0;' +
                'transform:rotate(-45deg);background:' + color + ';border:2px solid white;' +
                'box-shadow:0 0 2px rgba(0,0,0,.5);"></div>',
            anchor: new naver.maps.Point(size / 2, size)
        };
    }

    // 마커를 클릭(모바일에선 터치)하면 주소를 클립보드에 복사해주고, 잠깐 떴다 사라지는
    // 토스트로 알려준다. alert()는 지도 조작을 막는 모달이라 쓰지 않는다.
    function showToast(message) {
        var toast = document.createElement('div');
        toast.textContent = message;
        toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);' +
            'background:rgba(0,0,0,0.8);color:#fff;padding:10px 16px;border-radius:20px;' +
            'font-size:13px;z-index:9999;transition:opacity 0.3s;max-width:80%;text-align:center;';
        document.body.appendChild(toast);
        setTimeout(function () {
            toast.style.opacity = '0';
            setTimeout(function () { toast.remove(); }, 300);
        }, 1500);
    }

    function copyAddressToClipboard(name, address) {
        var done = function () { showToast(name + ' 주소가 복사되었습니다'); };
        var fail = function () { showToast('주소 복사에 실패했습니다: ' + address); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(address).then(done).catch(fail);
        } else {
            fail();
        }
    }

    // 목적지로 고른 시설은 더 크고 진한 색(강조)으로, 나머지는 평소 색으로 그린다.
    Object.keys(markersByType).forEach(function (type) {
        var color = typeStyles[type] || '#757575';
        markersByType[type].forEach(function (f) {
            var isDestination = f.name === destinationName;
            var marker = new naver.maps.Marker({
                position: new naver.maps.LatLng(f.lat, f.lng),
                map: map,
                title: f.name,
                icon: isDestination ? pinIcon('#D81B60', 26) : pinIcon(color, 14),
                zIndex: isDestination ? 200 : 100
            });
            if (f.address) {
                naver.maps.Event.addListener(marker, 'click', function () {
                    copyAddressToClipboard(f.name, f.address);
                });
            }
        });
    });

    if (myLocation) {
        var myLatLng = new naver.maps.LatLng(myLocation.lat, myLocation.lng);
        new naver.maps.Marker({
            position: myLatLng,
            map: map,
            icon: {
                content: '<div style="background:#4285F4;border:2px solid white;border-radius:50%;width:14px;height:14px;"></div>',
                anchor: new naver.maps.Point(7, 7)
            },
            title: '내 위치',
            zIndex: 300
        });
        map.setCenter(myLatLng);
    }

    if (routeCoords.length) {
        var path = routeCoords.map(function (p) { return new naver.maps.LatLng(p.lat, p.lng); });
        new naver.maps.Polyline({
            map: map,
            path: path,
            strokeColor: '#1E88E5',
            strokeWeight: 5,
            strokeOpacity: 0.85
        });

        var bounds = new naver.maps.LatLngBounds(path[0], path[0]);
        path.forEach(function (p) { bounds.extend(p); });
        map.fitBounds(bounds);
    }
</script>
