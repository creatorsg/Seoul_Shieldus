<div id="route-map" style="width:100%;height:${height}px;"></div>
<script type="text/javascript"
    src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=${client_id}"></script>
<script>
    var map = new naver.maps.Map('route-map', {
        center: new naver.maps.LatLng(37.5665, 126.9780),
        zoom: 13
    });

    var typeStyles = ${type_styles_json};
    var markersByType = ${markers_by_type_json};
    var destinationName = ${destination_name_json};
    var myLocation = ${my_location_json};
    var routeCoords = ${route_json};

    function pinIcon(color, size) {
        return {
            content: '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50% 50% 50% 0;' +
                'transform:rotate(-45deg);background:' + color + ';border:2px solid white;' +
                'box-shadow:0 0 2px rgba(0,0,0,.5);"></div>',
            anchor: new naver.maps.Point(size / 2, size)
        };
    }

    // 목적지로 고른 시설은 더 크고 진한 색(강조)으로, 나머지는 평소 색으로 그린다.
    Object.keys(markersByType).forEach(function (type) {
        var color = typeStyles[type] || '#757575';
        markersByType[type].forEach(function (f) {
            var isDestination = f.name === destinationName;
            new naver.maps.Marker({
                position: new naver.maps.LatLng(f.lat, f.lng),
                map: map,
                title: f.name,
                icon: isDestination ? pinIcon('#D81B60', 26) : pinIcon(color, 14),
                zIndex: isDestination ? 200 : 100
            });
        });
    });

    if (myLocation) {
        var myLatLng = new naver.maps.LatLng(myLocation.lat, myLocation.lng);
        new naver.maps.Marker({
            position: myLatLng,
            map: map,
            icon: {
                content: '<div style="background:#4285F4;border:2px solid white;border-radius:50%;width:14px;height:14px;"></div>',
                anchor: new naver.maps.Point(7, 7)
            },
            title: '내 위치',
            zIndex: 300
        });
        map.setCenter(myLatLng);
    }

    if (routeCoords.length) {
        var path = routeCoords.map(function (p) { return new naver.maps.LatLng(p.lat, p.lng); });
        new naver.maps.Polyline({
            map: map,
            path: path,
            strokeColor: '#1E88E5',
            strokeWeight: 5,
            strokeOpacity: 0.85
        });

        var bounds = new naver.maps.LatLngBounds(path[0], path[0]);
        path.forEach(function (p) { bounds.extend(p); });
        map.fitBounds(bounds);
    }
</script>
