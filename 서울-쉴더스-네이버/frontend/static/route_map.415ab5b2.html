    function pinIcon(color, size) {
        return {

                'transform:rotate(-45deg);background:' + color + ';border:2px solid white;' +

    // 토스트로 알려준다. alert()는 지도 조작을 막는 모달이라 쓰지 않는다.
    function showToast(message) {
        var toast = document.createElement('div');
        toast.textContent = message;
        toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);' +
            'background:rgba(0,0,0,0.8);color:#fff;padding:10px 16px;border-radius:20px;' +
            'font-size:13px;z-index:9999;transition:opacity 0.3s;max-width:80%;text-align:center;';
        document.body.appendChild(toast);
        setTimeout(function () {
            toast.style.opacity = '0';
            setTimeout(function () { toast.remove(); }, 300);
        }, 1500);
    }

    function copyAddressToClipboard(name, address) {
        var done = function () { showToast(name + ' 주소가 복사되었습니다'); };
        var fail = function () { showToast('주소 복사에 실패했습니다: ' + address); };

            navigator.clipboard.writeText(address).then(done).catch(fail);
        } else {
            fail();
        }
    }
