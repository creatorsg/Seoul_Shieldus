<!-- 
  서울-쉴더스 공통 헤더 컴포넌트 템플릿
  사용법: 페이지 상단에 삽입 후 텍스트 및 배지명 수정
-->
<header class="slide-header">
    <div class="header-left">
        <div class="header-tag-row">
            <span class="badge badge-primary">카테고리 라벨</span>
            <span class="text-xs text-sub">슬라이드 부가 설명</span>
        </div>
        <div class="main-title-group">
            <div class="main-title-icon">
                <!-- SVG Icon -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <div>
                <h1 class="main-title">슬라이드 메인 제목 <span class="highlight">(강조 텍스트)</span></h1>
                <p class="sub-title">슬라이드 세부 부제목 문구</p>
            </div>
        </div>
    </div>

    <div class="header-right">
        <div class="org-badge">
            <span class="dot"></span>
            <span>시스템 뱃지명</span>
        </div>
        <span class="slide-counter">SLIDE XX / 10</span>
    </div>
</header>
